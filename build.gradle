plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.139'
}

tasks.named('wrapper', Wrapper).configure
{
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories
{
    mavenLocal()
    mavenCentral()  // Add Maven Central for common dependencies
    maven
    {
        url = uri("https://maven.fabricmc.net")
    }
    maven
    {
        url = uri("https://repo.maven.apache.org/maven2")
    }
    maven
    {
        url = "https://api.modrinth.com/maven"
    }
    exclusiveContent
    {
        forRepository
        {
            maven
            {
                url "https://cursemaven.com"
            }
        }
        filter
        {
            includeGroup "curse.maven"
        }
    }
}

base
{
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge
{
    version = project.neo_version
    parchment
    {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers.from project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs
    {
        client
        {
            systemProperty 'mixin.debug.export', 'true'
            systemProperty 'mixin.debug.verbose', 'true'
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server
        {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer
        {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data
        {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach
        {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.WARN
        }
    }

    mods
    {
        "${mod_id}"
        {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources
{ 
    srcDir 'src/generated/resources'
}

configurations
{
    runtimeClasspath.extendsFrom localRuntime
}

dependencies
{
    //Needed for compile only

    //MMR
    compileOnly localRuntime("curse.maven:modular-machinery-reborn-1083840:8450758")
    compileOnly localRuntime("curse.maven:modular-machinery-reborn-mekanism-1131856:7731276")
    compileOnly localRuntime("curse.maven:experiencelib-1156551:7705470")
    compileOnly localRuntime("curse.maven:ldlib-626676:8108634")
    
    compileOnly localRuntime("curse.maven:modular-machinery-reborn-ars-nouveau-1132269:7731301")
    compileOnly localRuntime("curse.maven:experiencelib-1156551:6616717")
    compileOnly localRuntime("curse.maven:athena-841890:8061947")

    //KJS
    compileOnly localRuntime("curse.maven:kubejs-238086:7278501")
    compileOnly localRuntime("curse.maven:rhino-416294:7104526")

    //Recipe viewers
    compileOnly localRuntime("curse.maven:emi-580555:6420931")
    compileOnly localRuntime("curse.maven:jei-238222:8555356")

    //Pipez
    compileOnly localRuntime("curse.maven:pipez-443900:5609056")

    //Mekanism (needed for mmr)
    compileOnly localRuntime("curse.maven:mekanism-268560:7132168") //Tanks

    //Create rendering
    compileOnly("curse.maven:create-328085:7408951") //Rendering 

    //SFML (why, i shouldnt be touching this, it feels bad)
    compileOnly localRuntime("curse.maven:super-factory-manager-306935:7736527")

    compileOnly localRuntime("curse.maven:immersive-engineering-231951:6733669")

    //AlmostUnified
    compileOnly localRuntime("curse.maven:almostunified-633823:8127603")

    compileOnly localRuntime("curse.maven:mystical-agriculture-246640:8344249")
    localRuntime("curse.maven:cucumber-272335:8035802")

    //For devving
    localRuntime("curse.maven:spark-361579:6225208") //Profilers
    localRuntime("curse.maven:jade-324717:7428884") //Status of machines

    localRuntime("curse.maven:text-animator-881778:7379653")

    localRuntime("curse.maven:ctce-1296666:7850420")

    localRuntime("curse.maven:ars-nouveau-401955:8152094")
    localRuntime("curse.maven:curios-309927:6529130")
    localRuntime("curse.maven:geckolib-388172:7707149")
    localRuntime("curse.maven:occultism-361026:8037152")
    localRuntime("curse.maven:modonomicon-538392:7771524")
    localRuntime("curse.maven:smartbrainlib-661293:7055149")
    localRuntime("curse.maven:just-enough-immersive-multiblocks-634571:7131196")

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources)
{
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing
{
    publications
    {
        register('mavenJava', MavenPublication)
        {
            from components.java
        }
    }
    repositories
    {
        maven
        {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach
{
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}